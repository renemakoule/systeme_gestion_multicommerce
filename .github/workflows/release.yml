name: Build and Release GASNexus

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Backend (PyInstaller)
        working-directory: ./backend
        run: |
          pyinstaller --name main --onefile `
            --add-data "static;static" `
            --hidden-import "sqlmodel" `
            --hidden-import "passlib.handlers.bcrypt" `
            --hidden-import "multipart" `
            --distpath dist main.py

      - name: Install Root Dependencies
        run: npm install

      - name: Build and Publish Electron (Client)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron-publish:client

      - name: Build and Publish Electron (SuperAdmin)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron-publish:superadmin
